name: Build Linux, macOS & iOS (IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  build-linux:
    if: false # Disabled: already built successfully
    name: Linux x64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev file curl

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x scripts/build_appimage.sh

      - name: Build Linux AppImage
        run: |
          ./scripts/build_appimage.sh

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(sed -n 's/^appVersion=//p' gradle.properties)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyMusic-${{ steps.get_version.outputs.version }}-Linux-x64-AppImage
          path: dist/JoyMusic.AppImage
          if-no-files-found: error

  build-macos:
    if: false # Disabled: already built successfully
    name: macOS Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build macOS DMG
        run: |
          ./gradlew :desktopApp:packageReleaseDmg --no-daemon

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(sed -n 's/^appVersion=//p' gradle.properties)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyMusic-${{ steps.get_version.outputs.version }}-macOS-DMG
          path: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          if-no-files-found: error

  build-ios:
    name: iOS Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
      ORG_GRADLE_PROJECT_org.gradle.workers.max: "2"
      ORG_GRADLE_PROJECT_metrolist.verifyPackaging: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Kotlin Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x scripts/build_ios.sh
          chmod +x scripts/ios_version.sh

      - name: Precompile iOS Framework
        run: |
          ./gradlew :shared:linkDebugFrameworkIosArm64 --no-configuration-cache --stacktrace -Pmetrolist.verifyPackaging=false

      - name: Build iOS IPA
        run: |
          ./scripts/build_ios.sh --ipa

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(sed -n 's/^appVersion=//p' gradle.properties)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyMusic-${{ steps.get_version.outputs.version }}-iOS-IPA
          path: dist/JoyMusic.ipa
          if-no-files-found: error
