name: Build Linux AppImage

on:
  workflow_dispatch:
  push:
    branches: [ main, KMP ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  build-appimage:
    name: Linux x64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev file curl

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x scripts/build_appimage.sh

      - name: Build Linux AppImage
        run: |
          ./scripts/build_appimage.sh

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(sed -n 's/^appVersion=//p' gradle.properties)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyMusic-${{ steps.get_version.outputs.version }}-Linux-x64-AppImage
          path: dist/JoyMusic.AppImage
          if-no-files-found: error
